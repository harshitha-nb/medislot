services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medislot
      POSTGRES_PASSWORD: medislot
      POSTGRES_DB: medislot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata: